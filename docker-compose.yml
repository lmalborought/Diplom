services:
  db:
    image: postgres:15
    container_name: text_classification-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - net-back
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: text_classification-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
      DB_HOST: db
      HF_TOKEN: ${HF_TOKEN}
    networks:
      - net-back
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: text_classification-frontend
    ports:
      - "8081:80"
    volumes:
    - ./frontend:/usr/share/nginx/html:ro
    networks:
      - net-back
      - net-front
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:

networks:
  net-front:

  net-back:
