apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: text-classification
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        ports:
        - containerPort: 5432
        env:
        - name: DB_HOST
          value: "postgres"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_DB
          value: "app"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: text-classification
spec:
  selector:
    app: postgres
  ports:
  - port: 5432